name: Test installer and Hub
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n install.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test hub/test-*.mjs
      - run: python3 client/acp-bridge.py --selftest
